<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="https://db.com/logo_v2.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <title>azov.cc</title>
  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());

    document.onkeydown = function (e) {
      if (event.keyCode == 123) { // F12
        return false;
      }
      if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { // Ctrl+Shift+I
        return false;
      }
      if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { // Ctrl+Shift+C
        return false;
      }
      if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { // Ctrl+Shift+J
        return false;
      }
      if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { // Ctrl+U (View Source)
        return false;
      }
    };

    (function () {
      const detect = function () {
        const start = new Date();
        debugger;
        const end = new Date();
        if (end - start > 100) {
          document.body.innerHTML = '<div style="display:flex;align-items:center;justify-center;height:100vh;background:#07070a;color:white;font-family:sans-serif;">nooo bro nooo</div>';
        }
      };
      setInterval(detect, 1000);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
